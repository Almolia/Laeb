name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Start stack without workers
        # Full stack + 11 workers OOMs GitHub runners (~7GB).
        # Smoke only needs API containers behind the gateway.
        run: |
          set -euo pipefail
          mapfile -t SERVICES < <(docker compose config --services | grep -v -- '-worker$')
          echo "Starting: ${SERVICES[*]}"
          docker compose up -d --wait --wait-timeout 240 "${SERVICES[@]}"

      - name: Smoke through gateway
        run: bash scripts/smoke.sh

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=120 || true

      - name: Tear down
        if: always()
        run: docker compose down -v
