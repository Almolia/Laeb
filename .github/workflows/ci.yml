name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Start stack without workers
        # Skip *-worker to fit GHA RAM. Do not use --wait: MinIO has no
        # healthcheck binary (scratch image) and --wait then fails the job.
        run: |
          set -euo pipefail
          mapfile -t SERVICES < <(docker compose config --services | grep -v -- '-worker$')
          echo "Starting: ${SERVICES[*]}"
          docker compose up -d "${SERVICES[@]}"

      - name: Wait until smoke passes
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if bash scripts/smoke.sh; then
              echo "ready after attempt $i"
              exit 0
            fi
            echo "attempt $i failed; sleeping..."
            sleep 5
          done
          echo "smoke never passed"
          exit 1

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=120 || true

      - name: Tear down
        if: always()
        run: docker compose down -v
