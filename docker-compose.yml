name: laeb

x-service-env: &service-env
  ENV: ${ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
  JWT_ALG: ${JWT_ALG:-HS256}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
  RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
  EVENT_EXCHANGE: ${EVENT_EXCHANGE:-platform.events}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
  PLATFORM_ACCOUNT_ID: ${PLATFORM_ACCOUNT_ID:-00000000-0000-0000-0000-000000000001}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPER_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPER_USER:-postgres}"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    volumes: [mongodata:/data/db]
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  gateway:
    image: traefik:v3.1
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --accesslog=true
    ports: ["8000:80", "8080:8080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  mock-psp:
    build: { context: ., dockerfile: mock-psp/Dockerfile }
    ports: ["8020:8020"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 10s
      retries: 5

  identity:
    build: { context: ., dockerfile: services/identity/Dockerfile }
    environment:
      <<: *service-env
      SERVICE_NAME: identity
      DATABASE_URL: postgresql+psycopg://identity_user:${SERVICE_DB_PASSWORD:-servicepass}@postgres:5432/identity
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports: ["8001:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.identity.rule=PathPrefix(`/api/v1/identity`)
      - traefik.http.services.identity.loadbalancer.server.port=8000
      - traefik.http.middlewares.ratelimit.ratelimit.average=100
      - traefik.http.middlewares.ratelimit.ratelimit.burst=50
      - traefik.http.routers.identity.middlewares=ratelimit
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      retries: 5

  identity-worker:
    build: { context: ., dockerfile: services/identity/Dockerfile }
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *service-env
      SERVICE_NAME: identity-worker
      DATABASE_URL: postgresql+psycopg://identity_user:${SERVICE_DB_PASSWORD:-servicepass}@postgres:5432/identity
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  profile:
    build: { context: ., dockerfile: services/profile/Dockerfile }
    environment:
      <<: *service-env
      SERVICE_NAME: profile
      DATABASE_URL: postgresql+psycopg://profile_user:${SERVICE_DB_PASSWORD:-servicepass}@postgres:5432/profile
    ports: ["8002:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.profile.rule=PathPrefix(`/api/v1/profile`)
      - traefik.http.services.profile.loadbalancer.server.port=8000
      - traefik.http.routers.profile.middlewares=ratelimit@docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      retries: 5

  profile-worker:
    build: { context: ., dockerfile: services/profile/Dockerfile }
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *service-env
      SERVICE_NAME: profile-worker
      DATABASE_URL: postgresql+psycopg://profile_user:${SERVICE_DB_PASSWORD:-servicepass}@postgres:5432/profile
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  catalog:
