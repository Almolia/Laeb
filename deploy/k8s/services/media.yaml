apiVersion: apps/v1
kind: Deployment
metadata:
  name: media
  namespace: laeb
spec:
  replicas: 2
  selector:
    matchLabels: {app: media}
  template:
    metadata:
      labels: {app: media}
    spec:
      containers:
        - name: media
          image: laeb/media:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: laeb-config}
            - secretRef: {name: laeb-secrets}
          env:
            - {name: MINIO_ENDPOINT, value: "minio:9000"}
            - name: MINIO_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: laeb-secrets, key: MINIO_ACCESS_KEY}}
            - name: MINIO_SECRET_KEY
              valueFrom: {secretKeyRef: {name: laeb-secrets, key: MINIO_SECRET_KEY}}
            - {name: MINIO_BUCKET, value: media}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1000m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: media
  namespace: laeb
spec:
  selector: {app: media}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-worker
  namespace: laeb
spec:
  replicas: 1
  selector:
    matchLabels: {app: media-worker}
  template:
    metadata:
      labels: {app: media-worker}
    spec:
      containers:
        - name: media-worker
          image: laeb/media:latest
          imagePullPolicy: IfNotPresent
          command: [python, -m, app.worker]
          envFrom:
            - configMapRef: {name: laeb-config}
            - secretRef: {name: laeb-secrets}
          env:
            - {name: MINIO_ENDPOINT, value: "minio:9000"}
            - name: MINIO_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: laeb-secrets, key: MINIO_ACCESS_KEY}}
            - name: MINIO_SECRET_KEY
              valueFrom: {secretKeyRef: {name: laeb-secrets, key: MINIO_SECRET_KEY}}
            - {name: MINIO_BUCKET, value: media}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
