apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: laeb
spec:
  replicas: 2
  selector:
    matchLabels: {app: order}
  template:
    metadata:
      labels: {app: order}
    spec:
      containers:
        - name: order
          image: laeb/order:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: laeb-config}
            - secretRef: {name: laeb-secrets}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: laeb-secrets, key: ORDER_DATABASE_URL}}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1000m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: laeb
spec:
  selector: {app: order}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: laeb
spec:
  replicas: 1
  selector:
    matchLabels: {app: order-worker}
  template:
    metadata:
      labels: {app: order-worker}
    spec:
      containers:
        - name: order-worker
          image: laeb/order:latest
          imagePullPolicy: IfNotPresent
          command: [python, -m, app.worker]
          envFrom:
            - configMapRef: {name: laeb-config}
            - secretRef: {name: laeb-secrets}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: laeb-secrets, key: ORDER_DATABASE_URL}}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
